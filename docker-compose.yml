version: '3.8'

# ── Retail Data Platform — Local Airflow Setup ─────────────────────────────────
# Runs Apache Airflow locally using the LocalExecutor (no Redis/Celery needed)
#
# Usage:
#   docker-compose up -d          # start all services
#   docker-compose down           # stop all services
#   docker-compose logs -f        # follow logs
#
# Airflow UI: http://localhost:8080
# Default credentials: admin / admin

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1-python3.11
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'          # hide example DAGs
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'

    # SLA miss callback — logs to console (replace with Slack webhook for prod)
    AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC

    # Pass your project env vars into Airflow containers
    SNOWFLAKE_ACCOUNT:   ${SNOWFLAKE_ACCOUNT}
    SNOWFLAKE_USER:      ${SNOWFLAKE_USER}
    SNOWFLAKE_PASSWORD:  ${SNOWFLAKE_PASSWORD}
    SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-RETAIL_WH}
    SNOWFLAKE_DATABASE:  ${SNOWFLAKE_DATABASE:-RETAIL_DB}
    SNOWFLAKE_SCHEMA:    ${SNOWFLAKE_SCHEMA:-RAW}
    SNOWFLAKE_ROLE:      ${SNOWFLAKE_ROLE:-SYSADMIN}
    DATA_DIR:            /opt/airflow/data/raw
    ALERT_EMAIL:         ${ALERT_EMAIL:-divya.purli@gmail.com}

  volumes:
    - ./dags:/opt/airflow/dags                  # your DAG files
    - ./ingestion:/opt/airflow/ingestion        # ingestion scripts
    - ./data:/opt/airflow/data                  # source CSV files
    - ./logs:/opt/airflow/logs                  # Airflow task logs
    - ./plugins:/opt/airflow/plugins            # custom plugins (empty ok)
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:

  # ── Metadata database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER:     airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB:       airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # ── Airflow DB init (runs once) ────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Divya \
          --lastname Jagadeesan \
          --role Admin \
          --email divya.purli@gmail.com \
          --password admin
        echo "Airflow initialized successfully"
    environment:
      <<: *airflow-common-env
    restart: on-failure

  # ── Airflow Webserver ──────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ── Airflow Scheduler ──────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
